name: CI

on:
  pull_request:
  push:
    branches: [claude/entertainment-tracking-plan-sn9jp8]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cheese_test
          # The friendship table orders ids with `<`, which must agree with JavaScript's byte-wise comparison.
          POSTGRES_INITDB_ARGS: --locale=C
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cheese_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/cheese_test
          BETTER_AUTH_SECRET: ci-build-secret-ci-build-secret-123456
          BETTER_AUTH_URL: http://localhost:3000
